<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e6b47"><title>Camisetas de Tribuna</title>
<style>
:root{--bg:#eef1ef;--ink:#101914;--mut:#5d6b64;--card:#fff;--g:#0e6b47;--r:#c8352b;--ln:#d9dfdb}
@media(prefers-color-scheme:dark){:root{--bg:#0d1310;--ink:#eef3ef;--mut:#93a39a;--card:#17201b;--g:#2f9e6c;--ln:#26332c}}
*{box-sizing:border-box;margin:0}body{font:16px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:100px}
.wrap{max-width:640px;margin:auto;padding:0 14px}.top{padding:18px 0 10px}h1{font-size:23px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px;display:block;width:100%;text-align:left;color:inherit;font:inherit}
.grid .c{margin:0}.big{font-size:23px;font-weight:800;margin-top:2px}.mut{color:var(--mut);font-size:13px}.off{opacity:.5;text-decoration:line-through}
.row{display:flex;justify-content:space-between;gap:8px}h3{margin:14px 0 8px}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:15px;font:700 16px system-ui;width:100%;margin:6px 0}.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--ln)}.btn.d{background:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:0;color:var(--mut);padding:11px 0;font:600 12px system-ui}nav .on{color:var(--g)}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--g);color:#fff;font-size:34px;border:0;box-shadow:0 4px 14px #0005;z-index:5}
#sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#sh>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px;max-width:640px;margin:auto}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--ln);border-radius:10px;font:16px system-ui;background:var(--card);color:var(--ink);margin:4px 0 12px}label{font-size:13px;color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px 3px;border-bottom:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}
.chips{display:flex;gap:6px;margin-bottom:10px;overflow:auto}.chips button{border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:99px;font:600 14px system-ui;white-space:nowrap}.chips .on{background:var(--g);color:#fff;border-color:var(--g)}
.neg{color:var(--r)}.pos{color:var(--g)}
#lk{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#lk>div{width:100%;max-width:320px;text-align:center}
#tt{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:30}
</style></head><body>
<div class="wrap" id="main"></div><button class="fab" onclick="fab()">+</button><nav id="nav"></nav><div id="sh"></div><div id="lk"></div><div id="tt"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* TABLAS (un único documento en Supabase, tabla app_data):
 p  productos {id,n,t equipo,se temporada,cat,ve versión,sku,sup,co costo,pr precio,d ingreso,z:{talle:cantidad}}  <- fuente de verdad del stock
 s  ventas    {id,ts,d,pid→p,pn,z,q,pr,co,pay,c,o,v anulada}   (guarda precio y costo del momento)
 e  gastos    {id,ts,d,cat,desc,a,pay,o,v}
 m  movimientos de stock {id,ts,d,pid→p,pn,z,q(+/-),t:entrada|venta|anulación|ajuste}
 l  historial de modificaciones {id,ts,d,t} */
const PAY=['Efectivo','Transferencia','Mercado Pago','Otro'],SZ=['XS','S','M','L','XL','XXL','3XL','Niño'],CAT=['Jugador','Hincha','Retro','Entrenamiento','Otra'],GC=['Compra de mercadería','Envíos','Publicidad','Packaging','Impuestos','Comisiones','Herramientas/equipamiento','Transporte','Otros'],MER=GC[0],DIA=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=n=>'$'+Math.round(n).toLocaleString('es-AR'),nid=()=>D.n++,sum=(l,f)=>l.reduce((t,x)=>t+f(x),0);
const fmt=d=>d.toLocaleDateString('sv'),today=()=>fmt(new Date()),ds=d=>new Date(d+'T12:00'),add=(d,n)=>{const x=ds(d);x.setDate(x.getDate()+n);return fmt(x)},mon=d=>add(d,-((ds(d).getDay()+6)%7)),hm=t=>new Date(t).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const SB=supabase.createClient('https://xpkqjedqwqutdwxitsmm.supabase.co','sb_publishable_mo7RVh5yzJ6-rRWzT8y6nQ_fqUgVUG7');
let rev=0,sav=0,pend=0,run=Promise.resolve(),ult=0,ch;
const fresh=()=>({p:[],s:[],e:[],m:[],l:[],n:1,low:3});
/* La fuente de datos es Supabase (tabla app_data). D es solo la copia en memoria; save() la sube tras cada cambio. */
async function load(){const{data,error}=await SB.from('app_data').select('data,rev').maybeSingle();
 if(error){alert('No se pudo cargar desde Internet: '+error.message);return 0}
 if(data){if(data.rev==rev&&D)return 1;D={...fresh(),...data.data};rev=data.rev;return 1}
 D=fresh();rev=0;const o=localStorage.getItem('ctribuna_db');
 if(o&&confirm('Encontré datos guardados solo en este dispositivo. ¿Querés subirlos a la nube?'))try{D={...fresh(),...JSON.parse(o)};save()}catch(e){}
 return 1}
const doSave=async()=>{sav=1;try{const{data,error}=await SB.rpc('guardar',{nuevo:D,rev_esperada:rev});if(error)throw error;
 if(data==null){alert('Otro dispositivo guardó cambios antes que vos. Se recargaron los datos: repetí tu último cambio.');rev=-1;await load();render()}else{rev=data;ult=Date.now()}}
 catch(e){alert('⚠️ No se pudo guardar en Internet ('+(e.message||e)+'). Se recargan los datos guardados.');rev=-1;await load();render()}sav=0},
save=()=>{if(pend)return run;pend=1;return run=run.then(()=>{pend=0;return doSave()})},
sync=()=>{const r0=rev;return load().then(()=>{rev!=r0&&render(1)})};
let D,V='home',F={q:'',z:'',low:0,sp:'hoy',ty:'',a:'',b:''},P={t:'d',ref:''};
const Pr=i=>D.p.find(p=>p.id==i),tot=p=>sum(Object.values(p.z),x=>x),pl=p=>p.n+(p.ve?' · '+p.ve:''),S=()=>D.s.filter(x=>!x.v),E=()=>D.e.filter(x=>!x.v);
const mv=(pid,pn,z,q,t)=>D.m.push({id:nid(),ts:Date.now(),d:today(),pid,pn,z,q,t}),lg=t=>D.l.push({id:nid(),ts:Date.now(),d:today(),t});
const agg=(a,b)=>{const s=S().filter(x=>x.d>=a&&x.d<=b),e=E().filter(x=>x.d>=a&&x.d<=b),v=sum(s,x=>x.pr*x.q),c=sum(s,x=>x.co*x.q),g=sum(e.filter(x=>x.cat!=MER),x=>x.a);return{v,c,gb:v-c,g,n:v-c-g,ns:s.length,u:sum(s,x=>x.q),inv:sum(e.filter(x=>x.cat==MER),x=>x.a),s,e}};
const inP=x=>F.sp=='todas'||(F.sp=='hoy'?x.d==today():x.d.slice(0,7)==today().slice(0,7));
function go(v,f){if(v&&v!=V)Object.assign(F,{q:'',z:'',low:0});if(v)V=v;if(f)Object.assign(F,f);render()}
function render(k){$('#nav').innerHTML=[['home','🏠 Inicio'],['ventas','🧾 Ventas'],['stock','📦 Stock'],['gastos','💸 Gastos'],['mas','⋯ Más']].map(([k,l])=>`<button class="${V==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('#main').innerHTML=views[V]();k||scrollTo(0,0)}
const toast=t=>{const e=$('#tt');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)},sh=t=>{$('#sh').innerHTML='<div>'+t+'</div>';$('#sh').style.display='flex'},x=()=>$('#sh').style.display='none';
$('#sh').onclick=e=>e.target.id=='sh'&&x();
const up=()=>$('#lst').innerHTML=(V=='hist'?hl():sl()),chips=(k,a)=>`<div class="chips">${a.map(([v,l])=>`<button class="${F[k]==v?'on':''}" onclick="go(0,{${k}:'${v}'})">${l}</button>`).join('')}</div>`;
const zh=(p,a,b)=>Object.entries(p.z).sort((x,y)=>SZ.indexOf(x[0])-SZ.indexOf(y[0])).map(([k,n])=>n>0?k+a+n:`<span class="neg">${k}${a}0</span>`).join(b);
const sr=s=>`<button class="c ${s.v?'off':''}" onclick="sd(${s.id})"><div class="row"><b>${esc(s.pn)} · ${s.z} ×${s.q}</b><b>${money(s.pr*s.q)}</b></div><div class="mut">${s.d.slice(5)} ${hm(s.ts)} · ${s.pay}${s.c?' · '+esc(s.c):''}<br>Costo ${money(s.co*s.q)} · Ganancia ${money((s.pr-s.co)*s.q)}${s.v?' · ANULADA':''}</div></button>`;
const er=e=>`<button class="c ${e.v?'off':''}" onclick="gd(${e.id})"><div class="row"><b>${esc(e.desc)}</b><b>${money(e.a)}</b></div><div class="mut">${e.d.slice(5)} · ${esc(e.cat)} · ${e.pay}${e.v?' · ANULADO':''}</div></button>`;
const sl=()=>{const q=F.q.toLowerCase();return D.p.filter(p=>(!q||[p.n,p.t,p.se,p.cat,p.ve,p.sku].join(' ').toLowerCase().includes(q))&&(!F.z||p.z[F.z]>0)&&(!F.low||tot(p)<=D.low)).map(p=>`<button class="c" onclick="pd(${p.id})"><div class="row"><b>${esc(pl(p))}</b><b>${tot(p)}</b></div><div class="mut">${esc(p.t)} ${esc(p.se)} · ${zh(p,':','  ')||'Sin talles'} · ${money(p.pr)}</div></button>`).join('')||'<p class="mut">Sin productos.</p>'};
const hl=()=>{const q=F.q.toLowerCase(),r=[...D.s.map(x=>({ts:x.ts,d:x.d,ty:'Ventas',t:`Venta: ${x.pn} ${x.z} ×${x.q} · ${money(x.pr*x.q)}${x.v?' (anulada)':''}`})),...D.e.map(x=>({ts:x.ts,d:x.d,ty:'Gastos',t:`Gasto ${x.cat}: ${x.desc} · ${money(x.a)}${x.v?' (anulado)':''}`})),...D.m.filter(x=>x.t=='entrada').map(x=>({ts:x.ts,d:x.d,ty:'Entradas',t:`Entrada: ${x.pn} ${x.z} +${x.q}`})),...D.l.map(x=>({ts:x.ts,d:x.d,ty:'Modificaciones',t:x.t}))];return r.filter(x=>(!F.ty||x.ty==F.ty)&&(!F.a||x.d>=F.a)&&(!F.b||x.d<=F.b)&&(!q||x.t.toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts).slice(0,200).map(x=>`<div class="c"><div class="mut">${x.d} ${hm(x.ts)} · ${x.ty}</div>${esc(x.t)}</div>`).join('')||'<p class="mut">Sin movimientos.</p>'};
const rg=()=>{const r=P.ref,y=+r.slice(0,4),m=+r.slice(5,7);if(P.t=='d')return[[r,r,r]];if(P.t=='w'){const a=mon(r);return DIA.map((n,i)=>[n+' '+add(a,i).slice(8),add(a,i),add(a,i)])}
if(P.t=='m'){const o=[],e=fmt(new Date(y,m,0));let s=r.slice(0,8)+'01',i=1;while(s<=e){const f=add(mon(s),6),z=f<e?f:e;o.push(['Sem '+i++,s,z]);s=add(z,1)}return o}
return MES.map((n,i)=>[n,y+'-'+String(i+1).padStart(2,'0')+'-01',fmt(new Date(y,i+1,0))])};
const tl=()=>{const r=P.ref;return P.t=='d'?r:P.t=='w'?'Semana del '+rg()[0][1]:P.t=='m'?MES[+r.slice(5,7)-1]+' '+r.slice(0,4):r.slice(0,4)};
function pv(n){const r=P.ref,y=+r.slice(0,4),m=+r.slice(5,7);P.ref=P.t=='d'?add(r,n):P.t=='w'?add(r,7*n):P.t=='m'?fmt(new Date(y,m-1+n,1)):fmt(new Date(y+n,0,1));render()}
const ga=t=>{P={t,ref:today()};go('gan')};
const views={
home(){const t=today(),m=t.slice(0,7),a=agg(t,t),b=agg(m+'-01',m+'-31'),lo=D.p.filter(p=>tot(p)<=D.low),c=(l,v,f,k,s)=>`<button class="c" onclick="${f}"><div class="mut">${l}</div><div class="big ${k||''}">${v}</div>${s?`<div class="mut">${s}</div>`:''}</button>`;
return `<div class="top"><h1>Camisetas de Tribuna</h1></div><button class="btn" style="font-size:19px;padding:20px" onclick="nv()">Nueva venta</button><div class="grid">`+c('Ventas hoy',money(a.v),"go('ventas',{sp:'hoy'})")+c('Gastos hoy',money(a.g),"go('gastos',{sp:'hoy'})",'',a.inv?'+ '+money(a.inv)+' en mercadería':'')+c('Ganancia estimada hoy',money(a.n),"ga('d')",a.n<0?'neg':'pos')+c('Productos en stock',sum(D.p,tot),"go('stock')")+c('Ventas del mes',money(b.v),"go('ventas',{sp:'mes'})")+c('Gastos del mes',money(b.g),"go('gastos',{sp:'mes'})",'',b.inv?'+ '+money(b.inv)+' en mercadería':'')+c('Ganancia del mes',money(b.n),"ga('m')",b.n<0?'neg':'pos')+c('Stock bajo',lo.length,"go('stock',{low:1})",lo.length?'neg':'')+`</div><h3>Últimas ventas</h3>`+(S().sort((a,b)=>b.ts-a.ts).slice(0,4).map(sr).join('')||'<p class="mut">Todavía no hay ventas.</p>')+`<h3>Últimos gastos</h3>`+(E().sort((a,b)=>b.ts-a.ts).slice(0,4).map(er).join('')||'<p class="mut">Todavía no hay gastos.</p>')+(lo.length?`<h3>Stock bajo</h3>`+lo.slice(0,5).map(p=>`<button class="c" onclick="pd(${p.id})"><div class="row"><b>${esc(pl(p))}</b><b class="neg">${tot(p)}</b></div></button>`).join(''):'')},
ventas(){const l=D.s.filter(inP).sort((a,b)=>b.ts-a.ts),k=l.filter(x=>!x.v);return `<div class="top"><h1>Ventas</h1></div><button class="btn" onclick="nv()">Nueva venta</button>`+chips('sp',[['hoy','Hoy'],['mes','Este mes'],['todas','Todas']])+`<p class="mut" style="margin-bottom:8px">${k.length} ventas · ${money(sum(k,x=>x.pr*x.q))} · ganancia bruta ${money(sum(k,x=>(x.pr-x.co)*x.q))}</p>`+(l.map(sr).join('')||'<p class="mut">No hay ventas en este período.</p>')},
gastos(){const l=D.e.filter(inP).sort((a,b)=>b.ts-a.ts);return `<div class="top"><h1>Gastos</h1></div><button class="btn" onclick="xf()">Nuevo gasto</button>`+chips('sp',[['hoy','Hoy'],['mes','Este mes'],['todas','Todos']])+`<p class="mut" style="margin-bottom:8px">Total: ${money(sum(l.filter(x=>!x.v),x=>x.a))}${(m=>m?` · incluye ${money(m)} de mercadería (no resta en la ganancia)`:'')(sum(l.filter(x=>!x.v&&x.cat==MER),x=>x.a))}</p>`+(l.map(er).join('')||'<p class="mut">No hay gastos en este período.</p>')},
stock(){return `<div class="top"><h1>Stock</h1></div><div class="row"><button class="btn" onclick="pf()">Nuevo producto</button><button class="btn s" onclick="ef()">Entrada</button></div><input placeholder="Buscar equipo, temporada, versión…" value="${esc(F.q)}" oninput="F.q=this.value;up()">`+chips('z',[['','Todos'],...SZ.map(z=>[z,z])])+(F.low?'<p class="mut" style="margin-bottom:8px">Solo stock bajo (≤ '+D.low+')</p>':'')+`<div id="lst">${sl()}</div>`},
hist(){return `<div class="top"><h1>Historial</h1></div><select onchange="F.ty=this.value;up()">${['','Ventas','Gastos','Entradas','Modificaciones'].map(t=>`<option value="${t}" ${F.ty==t?'selected':''}>${t||'Todos los movimientos'}</option>`).join('')}</select><div class="row"><input type="date" value="${F.a}" onchange="F.a=this.value;up()"><input type="date" value="${F.b}" onchange="F.b=this.value;up()"></div><input placeholder="Producto o categoría" value="${esc(F.q)}" oninput="F.q=this.value;up()"><div id="lst">${hl()}</div>`},
gan(){const R=rg(),T=agg(R[0][1],R.at(-1)[2]),bt=(n,d)=>`<button class="btn s" style="width:56px;margin:0" onclick="pv(${d})">${n}</button>`;
return `<div class="top"><h1>Ganancias</h1></div><div class="chips">${[['d','Día'],['w','Semana'],['m','Mes'],['y','Año']].map(([k,l])=>`<button class="${P.t==k?'on':''}" onclick="P.t='${k}';go()">${l}</button>`).join('')}</div><div class="row" style="align-items:center;margin-bottom:10px">${bt('‹',-1)}<b>${tl()}</b>${bt('›',1)}</div>`+(P.t=='d'?'':`<div class="c" style="overflow:auto"><table><tr><th></th><th>Ventas</th><th>Costo</th><th>Gastos</th><th>Neta</th></tr>${R.map(([n,a,b])=>{const t=agg(a,b);return `<tr><td>${n}</td><td>${money(t.v)}</td><td>${money(t.c)}</td><td>${money(t.g)}</td><td class="${t.n<0?'neg':'pos'}">${money(t.n)}</td></tr>`}).join('')}</table></div>`)+`<div class="c"><b>${P.t=='d'?'Resumen del día':'Total'}</b>`+[['Ventas',money(T.v)],['Costo de productos vendidos',money(T.c)],['Ganancia bruta',money(T.gb)],['Gastos',money(T.g)],['Ganancia neta',`<span class="${T.n<0?'neg':'pos'}">${money(T.n)}</span>`],['Cantidad de ventas',T.ns],['Productos vendidos',T.u],['Invertido en mercadería',money(T.inv)]].map(([a,b])=>`<div class="row" style="padding:6px 0"><span>${a}</span><b>${b}</b></div>`).join('')+`</div><div class="c"><b>Caja por medio de pago</b><p class="mut">Ventas cobradas menos todo lo pagado</p>`+PAY.map(p=>`<div class="row" style="padding:5px 0"><span>${p}</span><b>${money(sum(T.s.filter(x=>x.pay==p),x=>x.pr*x.q)-sum(T.e.filter(x=>x.pay==p),x=>x.a))}</b></div>`).join('')+`</div><p class="mut">Ganancia neta = ventas − costo de lo vendido − gastos. Las compras de mercadería no se restan como gasto porque ya entran en el costo cuando se vende.</p>`},
mas(){return `<div class="top"><h1>Más</h1></div><button class="btn" onclick="ga('d')">Ganancias y análisis</button><button class="btn s" onclick="go('hist')">Historial</button><button class="btn s" onclick="bk()">Descargar copia de seguridad</button><button class="btn s" onclick="rs()">Restaurar copia</button><button class="btn s" onclick="SB.auth.signOut()">Cerrar sesión</button><p class="mut" style="margin-top:12px">Tus datos están en la nube y se sincronizan entre tus dispositivos. Descargá una copia seguido.</p><p class="mut">Sincronizado en la nube · ${D.s.length} ventas, ${D.e.length} gastos, ${D.p.length} productos${ult?' · último guardado '+hm(ult):''}</p>`}};
function form(t,fs,cb,ok,init){sh(`<h2 style="margin-bottom:12px">${t}</h2>`+fs.map(f=>{const o=f.o&&f.o.map(y=>Array.isArray(y)?y:[y,y]),i=`id="f_${f.k}"`;return `<label>${f.l}</label>`+(o?`<select ${i}>${o.map(([v,l])=>`<option value="${esc(v)}" ${v==f.v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:f.t=='area'?`<textarea ${i} rows="2">${esc(f.v)}</textarea>`:`<input ${i} type="${f.t||'text'}" ${f.t=='number'?'inputmode="decimal" min="0" step="any"':''} value="${esc(f.v)}">`)}).join('')+`<p id="er" class="neg"></p><button class="btn" id="ok">${ok||'Guardar'}</button><button class="btn s" onclick="x()">Cancelar</button>`);const g=k=>$('#f_'+k);$('#ok').onclick=()=>{const v={};fs.forEach(f=>v[f.k]=g(f.k).value.trim());const e=cb(v);if(e)$('#er').textContent=e;else{save();x();render()}};init&&init(g)}
const fab=()=>sh('<button class="btn" onclick="nv()">🧾 Nueva venta</button><button class="btn s" onclick="xf()">💸 Nuevo gasto</button><button class="btn s" onclick="ef()">📦 Entrada de stock</button><button class="btn s" onclick="pf()">➕ Nuevo producto</button>');
function nv(){const ps=D.p.filter(p=>tot(p)>0);if(!ps.length){x();return toast('No hay productos con stock')}
form('Nueva venta',[{k:'p',l:'Producto',o:ps.map(p=>[p.id,pl(p)+' ('+tot(p)+')'])},{k:'z',l:'Talle',o:[]},{k:'q',l:'Cantidad',t:'number',v:1},{k:'pr',l:'Precio de venta (unitario)',t:'number'},{k:'pay',l:'Medio de pago',o:PAY},{k:'c',l:'Cliente (opcional)'},{k:'o',l:'Observación',t:'area'}],v=>{if(!v.z)return 'Elegí un talle';const p=Pr(v.p),n=p.z[v.z]|0,q=+v.q;if(!(q>0)||q>n)return 'Stock insuficiente: quedan '+n;if(!(+v.pr>=0)||v.pr==='')return 'Ingresá el precio';p.z[v.z]=n-q;D.s.push({id:nid(),ts:Date.now(),d:today(),pid:p.id,pn:pl(p),z:v.z,q,pr:+v.pr,co:p.co,pay:v.pay,c:v.c,o:v.o});mv(p.id,pl(p),v.z,-q,'venta');save();toast('Venta registrada')},'Confirmar venta',g=>{const f=()=>{const p=Pr(g('p').value);g('z').innerHTML=Object.entries(p.z).filter(e=>e[1]>0).map(([k,n])=>`<option value="${k}">${k} (${n})</option>`).join('');g('pr').value=p.pr};g('p').onchange=f;f()})}
function sd(i){const s=D.s.find(y=>y.id==i);sh(`<h2>${esc(s.pn)}</h2><p>${s.d} ${hm(s.ts)} · Talle ${s.z} · ×${s.q}</p><p>Precio ${money(s.pr*s.q)} · Costo ${money(s.co*s.q)} · Ganancia ${money((s.pr-s.co)*s.q)}</p><p>${s.pay}${s.c?' · Cliente: '+esc(s.c):''}</p><p class="mut">${esc(s.o)}</p>`+(s.v?'<p class="neg"><b>Venta anulada</b></p>':`<button class="btn" onclick="es(${i})">Editar venta</button><button class="btn d" onclick="vs(${i})">Anular venta</button>`)+'<button class="btn s" onclick="x()">Cerrar</button>')}
function vs(i){if(!confirm('¿Seguro que querés anular esta venta? Esta acción devolverá los productos al stock.'))return;const s=D.s.find(y=>y.id==i),p=Pr(s.pid);if(p)p.z[s.z]=(p.z[s.z]|0)+s.q;s.v=1;mv(s.pid,s.pn,s.z,s.q,'anulación');lg('Venta anulada: '+s.pn+' ×'+s.q);save();x();render()}
function es(i){const s=D.s.find(y=>y.id==i);form('Editar venta',[{k:'q',l:'Cantidad',t:'number',v:s.q},{k:'pr',l:'Precio unitario',t:'number',v:s.pr},{k:'pay',l:'Medio de pago',o:PAY,v:s.pay},{k:'c',l:'Cliente',v:s.c},{k:'o',l:'Observación',t:'area',v:s.o}],v=>{const p=Pr(s.pid),q=+v.q,av=(p?p.z[s.z]|0:0)+s.q;if(!(q>0)||(p?q>av:q!=s.q))return 'Stock insuficiente: máximo '+av;if(p&&q!=s.q){p.z[s.z]=av-q;mv(s.pid,s.pn,s.z,s.q-q,'ajuste')}lg(`Venta editada: ${s.pn} (×${s.q}→×${q}, ${money(s.pr)}→${money(+v.pr)})`);Object.assign(s,{q,pr:+v.pr,pay:v.pay,c:v.c,o:v.o});save()})}
function xf(i){const e=i?D.e.find(y=>y.id==i):{};form(i?'Editar gasto':'Nuevo gasto',[{k:'cat',l:'Categoría',o:GC,v:e.cat||'Otros'},{k:'desc',l:'Descripción',v:e.desc},{k:'a',l:'Monto',t:'number',v:e.a},{k:'d',l:'Fecha',t:'date',v:e.d||today()},{k:'pay',l:'Medio de pago',o:PAY,v:e.pay},{k:'o',l:'Observación (opcional)',t:'area',v:e.o}],v=>{if(!v.desc||!(+v.a>0))return 'Completá descripción y monto';const r={cat:v.cat,desc:v.desc,a:+v.a,d:v.d||today(),pay:v.pay,o:v.o};if(i){Object.assign(e,r);lg('Gasto editado: '+v.desc)}else D.e.push({id:nid(),ts:Date.now(),...r});save()})}
function gd(i){const e=D.e.find(y=>y.id==i);sh(`<h2>${esc(e.desc)}</h2><p>${money(e.a)} · ${esc(e.cat)}</p><p>${e.d} · ${e.pay}</p><p class="mut">${esc(e.o)}</p>`+(e.v?'<p class="neg"><b>Gasto anulado</b></p>':`<button class="btn" onclick="xf(${i})">Editar gasto</button><button class="btn d" onclick="ve(${i})">Anular gasto</button>`)+'<button class="btn s" onclick="x()">Cerrar</button>')}
function ve(i){if(!confirm('¿Anular este gasto? Dejará de contarse en los totales.'))return;const e=D.e.find(y=>y.id==i);e.v=1;lg('Gasto anulado: '+e.desc);save();x();render()}
function pf(i){const p=i?Pr(i):{};form(i?'Editar producto':'Nuevo producto',[{k:'n',l:'Producto / nombre',v:p.n},{k:'t',l:'Equipo',v:p.t},{k:'se',l:'Temporada',v:p.se},{k:'cat',l:'Categoría',o:CAT,v:p.cat},{k:'ve',l:'Versión (ej: hincha, jugador)',v:p.ve},{k:'co',l:'Costo unitario',t:'number',v:p.co},{k:'pr',l:'Precio de venta',t:'number',v:p.pr},{k:'sup',l:'Proveedor',v:p.sup},{k:'sku',l:'Código / SKU (opcional)',v:p.sku},{k:'d',l:'Fecha de ingreso',t:'date',v:p.d||today()},...(i?[]:SZ.map(z=>({k:'z_'+z,l:'Stock talle '+z+' (vacío = no maneja este talle)',t:'number',v:''})))],v=>{if(!v.n||!(+v.pr>0))return 'Completá nombre y precio de venta';if(D.p.some(y=>y.id!=i&&y.n.trim().toLowerCase()==v.n.toLowerCase()&&(y.ve||'').trim().toLowerCase()==v.ve.toLowerCase()))return 'Ya existe un producto con ese nombre y versión. Agregale talles desde Entrada de stock o usá Unir con otro producto.';const r={n:v.n,t:v.t,se:v.se,cat:v.cat,ve:v.ve,co:+v.co||0,pr:+v.pr,sup:v.sup,sku:v.sku,d:v.d};if(i){Object.assign(p,r);lg('Producto editado: '+pl(p))}else{const n={id:nid(),...r,z:{}};SZ.forEach(z=>{const q=v['z_'+z];if(q!==''&&+q>=0){n.z[z]=Math.floor(+q);if(n.z[z]>0)mv(n.id,pl(n),z,n.z[z],'entrada')}});D.p.push(n)}save()})}
function pd(i){const p=Pr(i);sh(`<h2>${esc(pl(p))}</h2><p>${esc(p.t)} ${esc(p.se)} · ${esc(p.cat)} · ${esc(p.sup)} ${p.sku?'· '+esc(p.sku):''}</p><p>Costo ${money(p.co)} · Precio ${money(p.pr)} · Ingreso ${p.d}</p><p><b>Stock: ${tot(p)}</b> — ${zh(p,': ',' · ')||'sin talles'}</p><button class="btn" onclick="ef(${i})">Agregar stock</button><button class="btn s" onclick="af(${i})">Modificar stock</button><button class="btn s" onclick="pf(${i})">Editar producto</button><button class="btn s" onclick="mg(${i})">Unir con otro producto</button><button class="btn d" onclick="dp(${i})">Eliminar producto</button><h3>Movimientos</h3>`+(D.m.filter(m=>m.pid==i).sort((a,b)=>b.ts-a.ts).slice(0,15).map(m=>`<div class="row mut"><span>${m.d.slice(5)} · ${m.t} · ${m.z}</span><b>${m.q>0?'+':''}${m.q}</b></div>`).join('')||'<p class="mut">Sin movimientos.</p>'))}
function mg(i){const a=Pr(i),o=D.p.filter(p=>p.id!=i);if(!o.length){x();return toast('No hay otro producto')}
form('Unir productos',[{k:'t',l:'Pasar el stock y las ventas de "'+pl(a)+'" a este producto (y eliminar el duplicado)',o:o.map(p=>[p.id,pl(p)])}],v=>{const b=Pr(v.t);if(!confirm('Se elimina "'+pl(a)+'" y todo su stock y ventas pasan a "'+pl(b)+'". ¿Continuar?'))return 'Cancelado';
Object.entries(a.z).forEach(([z,q])=>{b.z[z]=(b.z[z]|0)+q});D.s.forEach(s=>{if(s.pid==a.id)s.pid=b.id});D.m.forEach(m=>{if(m.pid==a.id)m.pid=b.id});D.p=D.p.filter(p=>p.id!=a.id);lg('Productos unidos: '+pl(a)+' → '+pl(b));save()},'Unir')}
function dp(i){if(!confirm('¿Eliminar este producto? Las ventas ya registradas se conservan.'))return;const p=Pr(i);lg('Producto eliminado: '+pl(p));D.p=D.p.filter(y=>y.id!=i);save();x();render()}
function ef(i){if(!D.p.length){x();return toast('Primero creá un producto')}form('Entrada de stock',[{k:'p',l:'Producto',o:D.p.map(p=>[p.id,pl(p)]),v:i},{k:'z',l:'Talle',o:SZ,v:'M'},{k:'q',l:'Cantidad que entra',t:'number',v:1},{k:'co',l:'Costo unitario',t:'number'},{k:'g',l:'Registrar como gasto (compra de mercadería)',o:['Sí','No']}],v=>{const p=Pr(v.p),q=Math.floor(+v.q);if(!(q>0))return 'Ingresá una cantidad';p.z[v.z]=(p.z[v.z]|0)+q;if(+v.co>0)p.co=+v.co;mv(p.id,pl(p),v.z,q,'entrada');if(v.g=='Sí'&&p.co>0)D.e.push({id:nid(),ts:Date.now(),d:today(),cat:MER,desc:`Compra ${pl(p)} ${v.z} ×${q}`,a:q*p.co,pay:'Efectivo',o:''});save();toast('Stock actualizado')},'Registrar entrada',g=>{const f=()=>g('co').value=Pr(g('p').value).co;g('p').onchange=f;f()})}
function af(i){const p=Pr(i);form('Modificar stock',[{k:'z',l:'Talle',o:SZ.map(z=>[z,`${z} (hay ${p.z[z]|0})`])},{k:'q',l:'Cantidad correcta',t:'number',v:0}],v=>{const q=Math.floor(+v.q);if(!(q>=0))return 'La cantidad no puede ser negativa';const d=q-(p.z[v.z]|0);p.z[v.z]=q;mv(i,pl(p),v.z,d,'ajuste');lg(`Stock ajustado: ${pl(p)} ${v.z} → ${q}`);save()})}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='camisetas-tribuna-'+today()+'.json';a.click()}
function rs(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(t=>{try{const d=JSON.parse(t);if(!d.p||!d.s||!d.e)throw 0;if(!confirm('Esto reemplaza TODOS los datos actuales. ¿Continuar?'))return;D=d;save();render();toast('Copia restaurada')}catch{alert('El archivo no es una copia válida')}});i.click()}
function login(msg){const l=$('#lk');l.style.display='flex';l.innerHTML=`<div><h2 style="margin-bottom:14px">Camisetas de Tribuna</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><p class="neg">${msg||''}</p><button class="btn" id="lg">Entrar</button></div>`;
const t=async()=>{const{error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return login('Email o contraseña incorrectos');l.style.display='none';start()};$('#lg').onclick=t;$('#pw').onkeydown=e=>{if(e.key=='Enter')t()}}
async function start(){$('#main').innerHTML='<p class="mut" style="padding:30px">Cargando…</p>';
if(!await load()){$('#main').innerHTML='<div style="padding:30px"><p class="mut">Sin conexión con la base de datos.</p><button class="btn" onclick="start()">Reintentar</button></div>';return}
render();if(!ch)ch=SB.channel('ad').on('postgres_changes',{event:'*',schema:'public',table:'app_data'},p=>{const r=p.new&&p.new.rev;if(!sav&&!(r<=rev))sync()}).subscribe()}
SB.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'){D=null;login()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&!sav)sync()});
(async()=>{const{data}=await SB.auth.getSession();if(data.session)start();else login()})();
</script></body></html>
